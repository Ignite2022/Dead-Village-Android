name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Get the game files
        uses: actions/checkout@v4

      - name: Set up Godot export templates and Android signing
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          if [ "$HOME" != "/root" ]; then
            cp -r /root/.config/godot ~/.config/godot || true
            cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          fi

      - name: Download free realistic assets (Poly Haven, CC0)
        run: |
          command -v python3 >/dev/null || (apt-get update && apt-get install -y python3)
          python3 - <<'PY'
          import json, os, urllib.request
          UA = {"User-Agent": "DeadVillage-CI/1.0"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()
          def save(url, path):
              d = os.path.dirname(path)
              if d:
                  os.makedirs(d, exist_ok=True)
              with open(path, "wb") as f:
                  f.write(get(url))
          def files(aid):
              try:
                  return json.loads(get("https://api.polyhaven.com/files/" + aid))
              except Exception as e:
                  print("skip", aid, e)
                  return None
          def find(d, names):
              for k, v in d.items():
                  if k.lower() in names:
                      return v
              return None
          def res_url(m, fmt, prefs):
              for r in prefs:
                  try:
                      return m[r][fmt]["url"]
                  except Exception:
                      pass
              return None

          DATA = {"tex": {}, "hdri": "", "models": {"trees": [], "rocks": [], "plants": []}, "font": ""}
          TEX = {
              "ground": ["forrest_ground_01", "forest_leaves_02", "brown_mud_leaves_01", "forest_floor", "aerial_grass_rock"],
              "path":   ["brown_mud_02", "dirt_floor", "rocky_trail", "muddy_ground", "brown_mud_03"],
              "rock":   ["rock_face", "aerial_rocks_02", "rocky_terrain_02", "rock_boulder_dry"],
              "wall":   ["castle_brick_07", "stone_wall", "medieval_blocks_02", "old_stone_wall", "castle_wall_slates"],
              "wood":   ["weathered_planks", "wood_planks_grey", "old_planks_02", "brown_planks_03", "wood_planks"],
              "roof":   ["roof_tiles_14", "clay_roof_tiles_02", "roof_09", "roof_tiles"],
              "bark":   ["bark_brown_02", "bark_willow_02", "pine_bark", "bark_brown_01"],
          }
          for slot, ids in TEX.items():
              for aid in ids:
                  f = files(aid)
                  if not f:
                      continue
                  out = {}
                  for kind, names in (("alb", ("diffuse", "diff")), ("nor", ("nor_gl",)), ("rgh", ("rough", "roughness"))):
                      m = find(f, names)
                      url = res_url(m, "jpg", ("2k", "1k")) if m else None
                      if url:
                          p = "assets/tex/%s_%s.jpg" % (slot, kind)
                          try:
                              save(url, p)
                              out[kind] = "res://" + p
                          except Exception as e:
                              print("fail", url, e)
                  if "alb" in out:
                      DATA["tex"][slot] = out
                      print("texture", slot, "=", aid)
                      break

          for aid in ["dikhololo_night", "satara_night", "moonless_golf", "kloppenheim_02"]:
              f = files(aid)
              if f and "hdri" in f:
                  url = res_url(f["hdri"], "hdr", ("2k", "1k"))
                  if url:
                      try:
                          save(url, "assets/sky.hdr")
                          DATA["hdri"] = "res://assets/sky.hdr"
                          print("sky", aid)
                          break
                      except Exception as e:
                          print("fail", e)

          GROUPS = (
              ("rocks", ["rock_moss_set_01", "rock_moss_set_02", "namaqualand_boulder_02", "boulder_01"], 3),
              ("trees", ["fir_sapling", "pine_sapling_small", "tree_small_02", "dead_tree_trunk"], 2),
              ("plants", ["fern_02", "shrub_01", "shrub_02", "grass_medium_01"], 2),
          )
          for group, ids, limit in GROUPS:
              for aid in ids:
                  if len(DATA["models"][group]) >= limit:
                      break
                  f = files(aid)
                  if not f or "gltf" not in f:
                      continue
                  try:
                      g = f["gltf"]["1k"]["gltf"]
                      base = "assets/models/%s/" % aid
                      name = g["url"].split("/")[-1]
                      save(g["url"], base + name)
                      for rel, inc in g.get("include", {}).items():
                          save(inc["url"], base + rel)
                      DATA["models"][group].append("res://" + base + name)
                      print("model", group, aid)
                  except Exception as e:
                      print("fail model", aid, e)

          try:
              save("https://github.com/google/fonts/raw/main/ofl/specialelite/SpecialElite-Regular.ttf", "assets/font.ttf")
              DATA["font"] = "res://assets/font.ttf"
          except Exception as e:
              print("font fail", e)

          with open("asset_list.gd", "w") as fh:
              fh.write("const DATA = " + json.dumps(DATA, indent=1) + "\n")
          print(json.dumps(DATA, indent=1))
          PY

      - name: Import assets
        run: |
          timeout 900 godot --headless --import || timeout 900 godot --headless --editor --quit || true

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --verbose --export-debug "Android" build/DeadVillage.apk
          ls -la build

      - name: Save APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: DeadVillage-apk
          path: build/DeadVillage.apk

      - name: Publish APK as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dead Village build ${{ github.run_number }}
          files: build/DeadVillage.apk
